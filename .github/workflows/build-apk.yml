name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project
        run: |
          set -e
          echo "Files in repo root:"; ls -la
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"
          if [ -n "$ZIP" ]; then
            echo "Using zip: $ZIP"
            mkdir -p project
            unzip -q "$ZIP" -d project
            SETTINGS="$(find project -name settings.gradle | head -n 1)"
          else
            echo "No zip found, using files in the repo"
            SETTINGS="$(find . -name settings.gradle -not -path './project/*' | head -n 1)"
          fi
          if [ -z "$SETTINGS" ]; then echo "ERROR: settings.gradle not found. Upload nexan-src.zip to the repo root."; exit 1; fi
          ROOT="$(dirname "$SETTINGS")"
          echo "Project root: $ROOT"
          ls -la "$ROOT" "$ROOT/app"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          cd "$ROOT"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: cp "$ROOT/app/build/outputs/apk/debug/app-debug.apk" Nexan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Nexan-apk
          path: Nexan.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Nexan build ${{ github.run_number }}
          files: Nexan.apk
