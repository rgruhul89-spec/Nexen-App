name: Build Nexan APK
on:
  push:
    paths:
      - 'nexan-src.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Unpack project
        run: unzip -q nexan-src.zip -d project
      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --stacktrace
      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Nexan Ai build ${{ github.run_number }}
          files: project/app/build/outputs/apk/debug/app-debug.apk
